name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

      - name: Run check_syscfg unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository metadata and links
        run: python scripts/validate_repo.py

      - name: Check generated board documentation
        run: python scripts/generate_board_docs.py --check

      - name: Validate example index
        run: python scripts/list_examples.py --json > /tmp/examples.json
